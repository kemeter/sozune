name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  # Manual re-run so a release can be rebuilt without re-tagging (useful
  # when the workflow itself needed a fix). Pass the existing tag to build.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re-)build (e.g. 0.13.0)'
        required: true

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  # The tag being released: the pushed tag, or the manual input on re-run.
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # Each architecture builds on a runner of its own: arm64 under QEMU took
  # hours. The two images are then joined under the release's tags.
  docker:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  docker-manifest:
    runs-on: ubuntu-latest
    needs: [docker]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the multi-arch image
        working-directory: digests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${IMAGE_NAME}:${RELEASE_TAG}" \
            -t "${IMAGE_NAME}:latest" \
            $(printf "${IMAGE_NAME}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE_NAME}:${RELEASE_TAG}"

  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      # From the protobuf GitHub releases: the Ubuntu mirrors are not always
      # reachable from the runners.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2

      - name: Build dashboard
        run: cd dashboard && bun install --frozen-lockfile && bun run build

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/sozune dist/sozune
          cd dist
          tar -czf "sozune-${RELEASE_TAG}-linux-amd64.tar.gz" sozune
          sha256sum "sozune-${RELEASE_TAG}-linux-amd64.tar.gz" \
            > "sozune-${RELEASE_TAG}-linux-amd64.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: sozune-linux-amd64
          path: |
            dist/sozune-${{ env.RELEASE_TAG }}-linux-amd64.tar.gz
            dist/sozune-${{ env.RELEASE_TAG }}-linux-amd64.tar.gz.sha256

  chart:
    runs-on: ubuntu-latest
    # The chart runs the image of its release: published once it exists.
    needs: [docker-manifest]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: azure/setup-helm@v4

      - name: Package and push the chart
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          CHARTS: oci://ghcr.io/${{ github.repository_owner }}/charts
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io -u "$REGISTRY_USER" --password-stdin
          mkdir -p dist
          # One chart per release, numbered as the release and running its image.
          helm package charts/sozune --destination dist \
            --version "$RELEASE_TAG" --app-version "$RELEASE_TAG"
          helm push dist/sozune-*.tgz "$CHARTS"

  release:
    runs-on: ubuntu-latest
    needs: [docker-manifest, binary, chart]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@v8
        with:
          name: sozune-linux-amd64
          path: dist

      - name: Extract changelog section
        id: changelog
        run: |
          version="${RELEASE_TAG}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          # `gh release create` is not idempotent: it exits 1 if the release
          # already exists (e.g. tag pushed before this job, or a re-run).
          # Create it only when missing, then attach assets with --clobber so
          # the workflow stays safe to re-run.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md
          fi
          gh release upload "$TAG" --clobber \
            "dist/sozune-${TAG}-linux-amd64.tar.gz" \
            "dist/sozune-${TAG}-linux-amd64.tar.gz.sha256"
