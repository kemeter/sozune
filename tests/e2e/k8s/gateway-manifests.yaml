---
# Sōzune-owned GatewayClass — controllerName must match the constant in
# src/provider/kubernetes/gateway.rs (SOZUNE_CONTROLLER_NAME). Every HTTPRoute
# below joins sōzune through this class via the `gw` Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: sozune
spec:
  controllerName: kemeter.io/sozune
---
# Listener block is required by the Gateway API schema but ignored by
# Sōzune today — actual ports come from proxy.http.listen_address in
# config.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw
  namespace: sozune-test
spec:
  gatewayClassName: sozune
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
# Two HTTPRoutes targeting the same Services (svca, svcb) already created
# by manifests.yaml. Hostnames are prefixed `gw-` to keep the Gateway-API
# routes disjoint from the Ingress routes the previous suite exercises.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: svca-gw
  namespace: sozune-test
spec:
  parentRefs:
    - name: gw
  hostnames:
    - gw-svca.k8s-test.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: svca
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: svcb-gw
  namespace: sozune-test
spec:
  parentRefs:
    - name: gw
  hostnames:
    - gw-svcb.k8s-test.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: svcb
          port: 80
---
# Path-based routing on a single hostname — exercises that the conversion
# correctly emits one entrypoint per rule with the right path config.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: split-gw
  namespace: sozune-test
spec:
  parentRefs:
    - name: gw
  hostnames:
    - gw-split.k8s-test.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /a
      backendRefs:
        - name: svca
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /b
      backendRefs:
        - name: svcb
          port: 80
---
# Header + method matching on a single hostname. Only a GET carrying
# `X-Canary: yes` matches; anything else (wrong header, wrong method) gets
# 404. Exercises matches[].headers and matches[].method together (ANDed).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: match-gw
  namespace: sozune-test
spec:
  parentRefs:
    - name: gw
  hostnames:
    - gw-match.k8s-test.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
          method: GET
          headers:
            - name: X-Canary
              value: "yes"
      backendRefs:
        - name: svca
          port: 80
---
# Query-param matching. Only a request carrying `?debug=1` matches.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: query-gw
  namespace: sozune-test
spec:
  parentRefs:
    - name: gw
  hostnames:
    - gw-query.k8s-test.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
          queryParams:
            - name: debug
              value: "1"
      backendRefs:
        - name: svcb
          port: 80
---
# parentRef.sectionName selecting the Gateway's `http` listener by name.
# Served, because gw declares a listener named `http`.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: section-ok-gw
  namespace: sozune-test
spec:
  parentRefs:
    - name: gw
      sectionName: http
  hostnames:
    - gw-section-ok.k8s-test.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: svca
          port: 80
---
# parentRef.sectionName naming a listener that does not exist on gw.
# Refused: the route is out of scope, so it 404s.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: section-ghost-gw
  namespace: sozune-test
spec:
  parentRefs:
    - name: gw
      sectionName: ghost
  hostnames:
    - gw-section-ghost.k8s-test.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: svcb
          port: 80
