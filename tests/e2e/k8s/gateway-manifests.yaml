---
# Sōzune-owned GatewayClass — controllerName must match the constant in
# src/provider/kubernetes/gateway.rs (SOZUNE_CONTROLLER_NAME). Every HTTPRoute
# below joins sōzune through this class via the `gw` Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: sozune
spec:
  controllerName: kemeter.io/sozune
---
# Listener block is required by the Gateway API schema but ignored by
# Sōzune today — actual ports come from proxy.http.listen_address in
# config.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw
  namespace: sozune-test
spec:
  gatewayClassName: sozune
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
# Two HTTPRoutes targeting the same Services (svca, svcb) already created
# by manifests.yaml. Hostnames are prefixed `gw-` to keep the Gateway-API
# routes disjoint from the Ingress routes the previous suite exercises.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: svca-gw
  namespace: sozune-test
spec:
  parentRefs:
    - name: gw
  hostnames:
    - gw-svca.k8s-test.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: svca
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: svcb-gw
  namespace: sozune-test
spec:
  parentRefs:
    - name: gw
  hostnames:
    - gw-svcb.k8s-test.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: svcb
          port: 80
---
# Path-based routing on a single hostname — exercises that the conversion
# correctly emits one entrypoint per rule with the right path config.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: split-gw
  namespace: sozune-test
spec:
  parentRefs:
    - name: gw
  hostnames:
    - gw-split.k8s-test.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /a
      backendRefs:
        - name: svca
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /b
      backendRefs:
        - name: svcb
          port: 80
---
# Header + method matching on a single hostname. Only a GET carrying
# `X-Canary: yes` matches; anything else (wrong header, wrong method) gets
# 404. Exercises matches[].headers and matches[].method together (ANDed).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: match-gw
  namespace: sozune-test
spec:
  parentRefs:
    - name: gw
  hostnames:
    - gw-match.k8s-test.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
          method: GET
          headers:
            - name: X-Canary
              value: "yes"
      backendRefs:
        - name: svca
          port: 80
---
# Query-param matching. Only a request carrying `?debug=1` matches.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: query-gw
  namespace: sozune-test
spec:
  parentRefs:
    - name: gw
  hostnames:
    - gw-query.k8s-test.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
          queryParams:
            - name: debug
              value: "1"
      backendRefs:
        - name: svcb
          port: 80
---
# parentRef.sectionName selecting the Gateway's `http` listener by name.
# Served, because gw declares a listener named `http`.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: section-ok-gw
  namespace: sozune-test
spec:
  parentRefs:
    - name: gw
      sectionName: http
  hostnames:
    - gw-section-ok.k8s-test.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: svca
          port: 80
---
# parentRef.sectionName naming a listener that does not exist on gw.
# Refused: the route is out of scope, so it 404s.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: section-ghost-gw
  namespace: sozune-test
spec:
  parentRefs:
    - name: gw
      sectionName: ghost
  hostnames:
    - gw-section-ghost.k8s-test.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: svcb
          port: 80
---
# --- TLS passthrough ------------------------------------------------------
# A backend that terminates TLS itself with a self-signed cert, announcing
# which one answered. Sōzune reads the SNI from the ClientHello and forwards
# the encrypted bytes untouched.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tls-backend-entry
  namespace: sozune-test
data:
  run.sh: |
    #!/bin/sh
    set -e
    apk add --no-cache socat openssl >/dev/null 2>&1
    openssl req -x509 -newkey rsa:2048 -keyout /tmp/k.pem -out /tmp/c.pem \
      -days 1 -nodes -subj "/CN=passthrough.k8s-test.localhost" >/dev/null 2>&1
    exec socat OPENSSL-LISTEN:8443,cert=/tmp/c.pem,key=/tmp/k.pem,verify=0,fork,reuseaddr \
      SYSTEM:"echo k8s-tls-passthrough-ok"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-tls
  namespace: sozune-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: svc-tls
  template:
    metadata:
      labels:
        app: svc-tls
    spec:
      containers:
        - name: tls
          image: alpine:latest
          command: ["sh", "/entry/run.sh"]
          ports:
            - containerPort: 8443
          volumeMounts:
            - name: entry
              mountPath: /entry
      volumes:
        - name: entry
          configMap:
            name: tls-backend-entry
---
apiVersion: v1
kind: Service
metadata:
  name: svc-tls
  namespace: sozune-test
spec:
  selector:
    app: svc-tls
  ports:
    - port: 8443
      targetPort: 8443
---
# A Gateway whose TLS listener is in Passthrough mode. Its port must match a
# `proxy.tcp` listener declared in sozune's config — Sōzune does not open TCP
# ports on the fly.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tlsgw
  namespace: sozune-test
spec:
  gatewayClassName: sozune
  listeners:
    - name: passthrough
      protocol: TLS
      port: 18444
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: tls-passthrough
  namespace: sozune-test
spec:
  parentRefs:
    - name: tlsgw
      sectionName: passthrough
  hostnames:
    - passthrough.k8s-test.localhost
  rules:
    - backendRefs:
        - name: svc-tls
          port: 8443
