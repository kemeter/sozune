kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # Expose Sozune HTTP/HTTPS/API ports from the node container
      # back to the host. The Sozune Pod runs with hostNetwork: true
      # so binding on the node port is enough.
      - containerPort: 18180
        hostPort: 18180
        protocol: TCP
      - containerPort: 18443
        hostPort: 18443
        protocol: TCP
      - containerPort: 18181
        hostPort: 18181
        protocol: TCP
      # TLS passthrough listener, for the TLSRoute suite.
      - containerPort: 18444
        hostPort: 18444
        protocol: TCP
      # Raw TCP listener, for the TCPRoute suite.
      - containerPort: 18445
        hostPort: 18445
        protocol: TCP
      # UDP listener, for the UDPRoute suite.
      - containerPort: 18446
        hostPort: 18446
        protocol: UDP
      # Ports a Gateway opens from proxy.gateway_ports, for the
      # gateway-ports suite.
      - containerPort: 18447
        hostPort: 18447
        protocol: TCP
      - containerPort: 18448
        hostPort: 18448
        protocol: UDP
      # An HTTPS port a Gateway opens from proxy.gateway_ports, for the
      # gateway-https suite.
      - containerPort: 18449
        hostPort: 18449
        protocol: TCP
