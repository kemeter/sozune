# A Secret rather than a ConfigMap: config.yaml can hold the API users'
# password hashes and DNS provider credentials.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sozune.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sozune.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    {{- include "sozune.config" . | nindent 4 }}
