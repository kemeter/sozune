{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sozune.clusterName" . }}
  labels:
    {{- include "sozune.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["update", "patch"]
  {{- if .Values.rbac.secrets }}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  {{- if .Values.rbac.gatewayAPI }}
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - httproutes
      - tlsroutes
      - tcproutes
      - udproutes
      - gateways
      - gatewayclasses
      - referencegrants
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - httproutes/status
      - tlsroutes/status
      - tcproutes/status
      - udproutes/status
      - gateways/status
      - gatewayclasses/status
    verbs: ["update", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sozune.clusterName" . }}
  labels:
    {{- include "sozune.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "sozune.clusterName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sozune.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
